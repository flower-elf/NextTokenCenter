name: package

# 绿色包：内置 Windows Python 运行时的整包 zip。触发方式：
#   - Release 发布时自动构建并附加到 Release 资源
#   - release.yml 流水线调用
#   - 手动运行（该标签已有 Release 时附加为资源，否则只上传为 Actions 运行产物）

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要打包的标签（例如 v0.2.0，必须已存在）
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  green-package:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.event.release.tag_name }}
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Resolve version
      id: version
      shell: bash
      env:
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
      run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
    - name: Fetch pinned runtime
      run: python release/portable_runtime.py download --out "${{ runner.temp }}/runtime.tar.gz"
    - name: Fetch pinned wheels
      run: python release/portable_runtime.py wheels --out "${{ runner.temp }}/wheels"
    - name: Prepare trimmed runtime
      run: python release/portable_runtime.py prepare --tarball "${{ runner.temp }}/runtime.tar.gz" --dest python --wheels "${{ runner.temp }}/wheels"
    - name: Check the bundled interpreter imports the dependencies
      # 打包失败要在上传前暴露：site-packages 里少了 wheel，便携包解压即报错。
      # -B 防止 import 写出 __pycache__，verify 要求运行时树里没有字节码。
      run: python\python.exe -B -c "import cryptography, brotli, zstandard"
    - name: Build portable package
      shell: bash
      env:
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
        VERSION: ${{ steps.version.outputs.value }}
      run: |
        python release/release_tools.py portable \
          --version "$VERSION" --tag "$TAG" --runtime python \
          --out "dist/next-token-center-v$VERSION.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: next-token-center-v${{ steps.version.outputs.value }}
        path: dist/*.zip
    - name: Attach to release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag || github.event.release.tag_name }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/*.zip --clobber
        else
          echo "Release $TAG 不存在，只保留 Actions 运行产物"
        fi
